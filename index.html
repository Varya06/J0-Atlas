<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mars SafeNav - Hackathon Valencia</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      height: 100vh;
      background: #0b0d17;
      color: #ffffff;
    }
    #sidebar {
      width: 330px;
      padding: 20px;
      background: #141829;
      border-right: 1px solid #2a3152;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 1000;
    }
    h2 {
      margin: 0;
      font-size: 1.4rem;
      color: #ff9e64;
    }
    .subtitulo {
      margin: -10px 0 4px 0;
      font-size: 0.8rem;
      color: #7aa2f7;
    }
    #map {
      flex: 1;
      height: 100%;
      background: #1a110d;
    }
    label {
      font-size: 0.85rem;
      color: #9aa5ce;
      display: block;
      margin-bottom: 6px;
    }
    select, button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #3b4261;
      background: #1f2335;
      color: #ffffff;
      font-size: 0.95rem;
    }
    button {
      background: #e05a2b;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: auto;
    }
    button:hover {
      background: #c94b1f;
    }
    .panel {
      background: #1f2335;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #2e3552;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .estado-ok { color: #4ade80; font-weight: bold; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>Mars SafeNav</h2>
    <p class="subtitulo">Región: Cráter Jezero (18.38° N, 77.58° E)</p>

    <div>
      <label for="capaSelect">Capa científica de Marte</label>
      <select id="capaSelect">
        <option value="optico">Óptico (Viking / HiRISE)</option>
        <option value="topografico">Topográfico (Elevación MOLA)</option>
        <option value="termico">Térmico (Inercia THEMIS)</option>
      </select>
    </div>

    <div>
      <label for="vehiculoSelect">Vehículo / Explorador</label>
      <select id="vehiculoSelect">
        <option value="3">Astronauta a pie (3 km/h - Máx. 30°)</option>
        <option value="5">Rover ligero (5 km/h - Máx. 20°)</option>
        <option value="15">Vehículo presurizado (15 km/h - Máx. 15°)</option>
      </select>
    </div>

    <div class="panel" id="infoRuta">
      Haz clic en dos puntos del mapa para marcar el <b>Origen (A)</b> y el <b>Destino (B)</b>.
    </div>

    <button id="btnLimpiar">Reiniciar ruta</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="lib/pathfinding-browser.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
